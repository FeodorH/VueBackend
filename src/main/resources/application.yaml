spring:
  application:
    name: VueBackend

  datasource:
    # jdbc:h2:file: — префикс для файлового режима
    # ./data/vueBackendDb — путь, где будет храниться файл БД (папка data создастся сама)
    url: jdbc:h2:file:./data/vueBackendDb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    # ВАЖНО: ddl-auto=update сохранит данные при перезапуске, просто обновляя схему
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console